<div class="py-20 flex justify-center items-center min-h-screen bg-gray-100">
  <div
    class="flex bg-white rounded-xl shadow-lg overflow-hidden mx-auto max-w-4xl w-full"
  >
    <!-- Imagem lateral -->
    <div
      class="hidden lg:block lg:w-1/2 bg-cover min-h-[500px]"
      style="background-image: url('/IT Team.png')"
    ></div>

    <!-- Formulário -->
    <div class="w-full p-8 lg:w-1/2">
      <div class="flex justify-center mb-6">
        <img class="h-14" src="SpaceX Dark.png" alt="Logo" />
      </div>

      <p class="text-xl text-gray-600 text-center mb-6">
        Bem-vindo(a) de volta!
      </p>

      <!-- Login com Google -->
      <button
        type="button"
        class="flex items-center justify-center w-full bg-white text-gray-600 rounded-lg shadow-md hover:bg-gray-50 transition"
      >
        <div class="px-4 py-3">
          <svg class="h-6 w-6" viewBox="0 0 40 40">
            <path
              d="M36.3425 16.7358H35V16.6667H20V23.3333H29.4192C28.045 27.2142 24.3525 30 20 30C14.4775 30 10 25.5225 10 20C10 14.4775 14.4775 9.99999 20 9.99999C22.5492 9.99999 24.8683 10.9617 26.6342 12.5325L31.3483 7.81833C28.3717 5.04416 24.39 3.33333 20 3.33333C10.7958 3.33333 3.33335 10.7958 3.33335 20C3.33335 29.2042 10.7958 36.6667 20 36.6667C29.2042 36.6667 36.6667 29.2042 36.6667 20C36.6667 18.8825 36.5517 17.7917 36.3425 16.7358Z"
              fill="#FFC107"
            />
            <path
              d="M5.25497 12.2425L10.7308 16.2583C12.2125 12.59 15.8008 9.99999 20 9.99999C22.5491 9.99999 24.8683 10.9617 26.6341 12.5325L31.3483 7.81833C28.3716 5.04416 24.39 3.33333 20 3.33333C13.5983 3.33333 8.04663 6.94749 5.25497 12.2425Z"
              fill="#FF3D00"
            />
            <path
              d="M20 36.6667C24.305 36.6667 28.2167 35.0192 31.1742 32.34L26.0159 27.975C24.3425 29.2425 22.2625 30 20 30C15.665 30 11.9842 27.2359 10.5975 23.3784L5.16254 27.5659C7.92087 32.9634 13.5225 36.6667 20 36.6667Z"
              fill="#4CAF50"
            />
            <path
              d="M36.3425 16.7358H35V16.6667H20V23.3333H29.4192C28.7592 25.1975 27.56 26.805 26.0133 27.9758C26.0142 27.975 26.015 27.975 26.0158 27.9742L31.1742 32.3392C30.8092 32.6708 36.6667 28.3333 36.6667 20C36.6667 18.8825 36.5517 17.7917 36.3425 16.7358Z"
              fill="#1976D2"
            />
          </svg>
        </div>
        <span class="px-4 py-3 font-semibold">Entrar com Google</span>
      </button>

      <!-- Separador -->
      <div class="mt-6 flex items-center justify-between">
        <span class="border-b w-1/5 lg:w-1/4"></span>
        <span class="text-xs text-gray-500 uppercase">ou login com e-mail</span>
        <span class="border-b w-1/5 lg:w-1/4"></span>
      </div>

      <!-- Formulário de Login -->
      <form (ngSubmit)="onSubmit()" class="mt-6">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">
            Email Address
          </label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Digite seu e-mail"
            class="bg-gray-200 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
            required
          />
        </div>

        <div class="mb-6">
          <div class="flex justify-between items-center">
            <label class="block text-gray-700 text-sm font-bold mb-2">
              Password
            </label>
            <a href="#" class="text-xs text-gray-500 hover:text-blue-600"
              >Esqueceu a senha?</a
            >
          </div>
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Digite sua senha"
            class="bg-gray-200 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-gray-300 rounded py-2 px-4 block w-full appearance-none"
            required
          />
        </div>

        <button
          type="submit"
          class="bg-blue-600 text-white font-semibold py-2 px-4 w-full rounded hover:bg-blue-700 transition"
        >
          Login
        </button>
      </form>

      <!-- Rodapé -->
      <div class="mt-6 flex items-center justify-between">
        <span class="border-b w-1/5 md:w-1/4"></span>
        <a href="#" class="text-xs text-gray-500 uppercase hover:text-blue-600"
          >ou criar conta</a
        >
        <span class="border-b w-1/5 md:w-1/4"></span>
      </div>
    </div>
  </div>
</div>
